[package]
name = "oar-ocr"
version = "0.2.2"
edition = "2024"
license = "Apache-2.0"
authors = ["Wang Xin <xinwang614@gmail.com>"]
description = "A comprehensive OCR library built in Rust with ONNX Runtime for efficient inference"
repository = "https://github.com/greatv/oar-ocr"
homepage = "https://github.com/greatv/oar-ocr"
readme = "README.md"
keywords = [
  "computer-vision",
  "machine-learning",
  "ocr",
  "onnx",
  "text-recognition",
]
categories = ["computer-vision", "science"]

[dependencies]
ab_glyph = { version = "0.2", optional = true }
image = "0.25.6"
imageproc = "0.25.0"
itertools = "0.14"
nalgebra = "0.34"
ndarray = "0.16"
once_cell = "1.19"
ort = "2.0.0-rc.10"
rayon = "1.8"
regex = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
clap = { version = "4.5.42", features = ["derive"] }

[features]
default = []
coreml = ["ort/coreml"]
# ONNX Runtime execution provider features
cuda = ["ort/cuda"]
directml = ["ort/directml"]
openvino = ["ort/openvino"]
tensorrt = ["ort/tensorrt"]
visualization = ["dep:ab_glyph"]
webgpu = ["ort/webgpu"]
